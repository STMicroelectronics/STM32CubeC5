# yaml-language-server: $schema=https://raw.githubusercontent.com/Open-CMSIS-Pack/devtools/schemas/projmgr/2.11.0/tools/projmgr/schemas/csolution.schema.json
solution:
  target-types:
    - type: NUCLEO-C5A3ZG
      device: STM32C5A3ZGT6
      define:
        - USE_TRACE: 0
  output-dirs:
    tmpdir: project/tmp
    outdir: $SolutionDir()$/build/$Project$.$BuildType$
  packs:
    - pack: STMicroelectronics::CMSIS
      path: ../../../../../../arch/cmsis
    - pack: STMicroelectronics::basic_stdio
      path: ../../../../../../utilities/basic_stdio
    - pack: STMicroelectronics::mbedtls
      path: ../../../../../../middleware/mbedtls
    - pack: STMicroelectronics::mcuboot
      path: ../../../../../../middleware/mcuboot
    - pack: STMicroelectronics::stcryptolib
      path: ../../../../../../middleware/stcryptolib
    - pack: STMicroelectronics::stfcf
      path: ../../../../../../middleware/stfcf
    - pack: STMicroelectronics::stm32c5xx_dfp
      path: ../../../../../../stm32c5xx_dfp
    - pack: STMicroelectronics::stm32c5xx_hal_drivers
      path: ../../../../../../stm32c5xx_drivers
    - pack: STMicroelectronics::rot_provisioning
      path: ../../../../../../utilities/rot_provisioning
    - pack: STMicroelectronics::syscalls
      path: ../../../../../../utilities/syscalls
  build-types:
    - type: release_AC6
      compiler: AC6
  projects:
    - project: ./oemirot/oemirot.cproject.yml
