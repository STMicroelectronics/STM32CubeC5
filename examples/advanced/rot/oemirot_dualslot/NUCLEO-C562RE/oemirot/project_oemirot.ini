[provisioning]
ini_path=./../provisioning/provisioning.ini

[build]
binary_path = ./../bin/oemirot.hex

[header]
mcuboot_config_path = ./mcuboot_config.h
flash_layout_path = ./flash_layout.h
boot_hal_cfg_path = ./boot_hal_cfg.h

[AC6]
linker = ./user_modifiable/Device/STM32C562RET6/stm32c562xe_flash.sct

[IAR]
linker = ./user_modifiable/Device/STM32C562RET6/stm32c562xe_flash.icf

[GCC]
linker = ./user_modifiable/Device/STM32C562RET6/stm32c562xe_flash.ld
