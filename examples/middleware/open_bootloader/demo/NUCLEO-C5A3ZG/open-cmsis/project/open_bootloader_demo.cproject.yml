# yaml-language-server: $schema=https://raw.githubusercontent.com/Open-CMSIS-Pack/devtools/schemas/projmgr/2.11.0/tools/projmgr/schemas/cproject.schema.json
project:
  processor:
    trustzone: off
    dsp: on
  rte:
    base-dir: $SolutionDir()$/../user_modifiable
  generators:
    base-dir: generated
  output:
    base-name: $Project$
    type:
      - elf
      - bin
      - hex
  setups:
    - setup: release_AC6
      misc:
        - ASM:
            - -Oz
            - -g
          C:
            - -Oz
            - -std=gnu11
            - -fno-exceptions
            - -fno-rtti
            - -funsigned-char
            - -g
            - -Wmissing-prototypes
          CPP:
            - -Oz
            - -std=gnu++14
            - -fno-exceptions
            - -fno-rtti
            - -funsigned-char
            - -g
            - -Wmissing-prototypes
          for-compiler: AC6
          Link-C:
            - --map
            - --library_type=microlib
            - --symbols
            - --show_full_path
            - --inline
            - --any_contingency
          Link-CPP:
            - --library_type=microlib
            - --symbols
            - --map
            - --show_full_path
            - --inline
            - --any_contingency
      for-context:
        - .release_AC6
  components:
    - component: STMicroelectronics::BOOTLOADER:OpenBootloader Core:Common@7.0.0
    - component: STMicroelectronics::BOOTLOADER:OpenBootloader Flash Module:Flash_Module@7.0.0
    - component: STMicroelectronics::BOOTLOADER:OpenBootloader I2C Module:I2C_Module@7.0.0
    - component: STMicroelectronics::BOOTLOADER:OpenBootloader IWDG Module:IWDG_Module@7.0.0
    - component: STMicroelectronics::BOOTLOADER:OpenBootloader Interface:Interface@7.0.0
    - component: STMicroelectronics::BOOTLOADER:OpenBootloader OB Module:OB_Module@7.0.0
    - component: STMicroelectronics::BOOTLOADER:OpenBootloader RO Bytes Module:RO_Module@7.0.0
    - component: STMicroelectronics::BOOTLOADER:OpenBootloader Ram Module:Ram_Module@7.0.0
    - component: STMicroelectronics::BOOTLOADER:OpenBootloader SPI Module:SPI_Module@7.0.0
    - component: STMicroelectronics::BOOTLOADER:OpenBootloader USART Module:USART_Module@7.0.0
    - component: STMicroelectronics::BOOTLOADER:OpenBootloader USB Module:USB_Module@7.0.0
    - component: STMicroelectronics::BOOTLOADER:STM32CubeMX2 Config:OpenBootloader@7.0.0
