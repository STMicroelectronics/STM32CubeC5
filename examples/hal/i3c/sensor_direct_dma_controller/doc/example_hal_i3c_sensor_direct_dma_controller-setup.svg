<svg width="600" height="250" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="14">
  <!-- Background -->
  <rect width="100%" height="100%" fill="white" />
  
  <!-- Left box -->
  <rect x="20" y="30" width="250" height="180" fill="#4AB3E0" stroke="black" stroke-width="1" rx="8" ry="8" />
  <rect x="20" y="30" width="250" height="180" fill="none" stroke="black" stroke-width="1" />
  
  <!-- Left box text -->
  <text x="35" y="60" font-weight="bold" fill="black">STM32 MCU</text>
  <text x="35" y="80" font-weight="bold" fill="black">(Controller Board)</text>
  
  <text x="35" y="120" fill="black">I3C1_SCL</text>
  <circle cx="115" cy="115" r="6" fill="white" stroke="black" stroke-width="1" />
  
  <text x="35" y="150" fill="black">I3C1_SDA</text>
  <circle cx="115" cy="145" r="6" fill="white" stroke="black" stroke-width="1" />
  
  <text x="35" y="180" fill="black">GND</text>
  <circle cx="115" cy="175" r="6" fill="white" stroke="black" stroke-width="1" />
  
  <!-- Right box -->
  <rect x="320" y="30" width="250" height="180" fill="#4AB3E0" stroke="black" stroke-width="1" rx="8" ry="8" />
  <rect x="320" y="30" width="250" height="180" fill="none" stroke="black" stroke-width="1" />
  
  <!-- Right box text -->
  <text x="335" y="60" font-weight="bold" fill="black">LSM6DSV16X</text>
  <text x="335" y="80" font-weight="bold" fill="black">(Sensor on X- NUCLEO</text>
  <text x="335" y="100" font-weight="bold" fill="black">- IKS4A1 Board)</text>
  
  <text x="475" y="120" fill="black">SCL</text>
  <circle cx="410" cy="115" r="6" fill="white" stroke="black" stroke-width="1" />
  
  <text x="475" y="150" fill="black">SDA</text>
  <circle cx="410" cy="145" r="6" fill="white" stroke="black" stroke-width="1" />
  
  <text x="475" y="180" fill="black">GND</text>
  <circle cx="410" cy="175" r="6" fill="white" stroke="black" stroke-width="1" />
  
  <!-- Connections -->
  <!-- I3C1_SCL to SCL -->
  <line x1="121" y1="115" x2="404" y2="115" stroke="black" stroke-width="2" />
  <line x1="404" y1="115" x2="410" y2="115" stroke="black" stroke-width="2" />
  
  <!-- I3C1_SDA to SDA -->
  <line x1="121" y1="145" x2="404" y2="145" stroke="black" stroke-width="2" />
  <line x1="404" y1="145" x2="410" y2="145" stroke="black" stroke-width="2" />
  
  <!-- GND to GND -->
  <line x1="121" y1="175" x2="404" y2="175" stroke="black" stroke-width="2" />
  <line x1="404" y1="175" x2="410" y2="175" stroke="black" stroke-width="2" />
</svg>